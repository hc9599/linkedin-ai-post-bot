id: csharp-dotnet
display_name: C# / .NET
review_niche_label: C# and/or .NET
code_language: csharp
default_angle: Write for a mixed audience of developers and hiring managers about this topic.

hashtags:
  - "#CSharp"
  - "#DotNet"
  - "#Programming"
  - "#SoftwareDevelopment"

relevance_keywords:
  - dotnet
  - .net
  - csharp
  - c#
  - asp.net
  - blazor
  - entity framework
  - nuget
  - roslyn
  - maui
  - xamarin
  - azure functions
  - visual studio
  - rider
  - minimal api
  - orleans
  - signalr
  - ef core
  - wpf
  - winforms
  - msbuild
  - binlog
  - testing.platform
  - microsoft.testing
  - xunit
  - nunit
  - mstest
  - aspnet

pulse_queries:
  - ai
  - cloud
  - performance
  - security
  - open source
  - developer tools

persona: |
  You are a senior software engineer, 8+ yrs, posting on LinkedIn for a mixed feed —
  developers, hiring managers, and tech-curious readers. You read an article today and
  it triggered a thought about your own past work. You have shipped things in your career
  — but you did NOT ship, build, migrate to, deploy, or use whatever THIS article is
  describing. You are reacting from the outside, not as a user of the thing. Explain why
  the topic matters in plain English first; gloss any technical term inline. "This reminded
  me of X from a job years ago" is fine. "I shipped this" or "I tried this and" about the
  article's subject is FORBIDDEN. Write like a senior dev briefing a smart non-dev colleague,
  not lecturing peers or addressing 'my network'. Never start with 'In today's fast-paced world'
  or 'I'm excited to share'. No emoji unless it's one dry 😅 or 💀 max. Contractions always.
  Short sentences mixed with one longer rant sentence. One concrete detail from the article
  (a number, a quote, a gotcha) — used as the SPARK, not turned into a war story, and not a summary.

sources:
  reddit_subreddits:
    - csharp
    - dotnet
  devto_tags:
    - dotnet
    - csharp
  hn_queries:
    - dotnet
    - csharp
    - asp.net
    - csharp performance
    - dotnet architecture
  rss_feeds:
    - name: .NET Dev Blog
      urls:
        - https://devblogs.microsoft.com/dotnet/feed/
        - https://devblogs.microsoft.com/dotnet/feed/atom/

weekday_angles:
  0:
    focus: Focus on a C# or .NET change — what it means for delivery, reliability, or team skill, not a feature recap.
    audience_signal: A hiring manager should grasp why this matters to hiring or project risk; devs should still recognise the niche.
    avoid: Do not recap the article. No unexplained syntax or API names without a plain-English gloss.
  1:
    focus: Focus on tooling — what changes in how a team ships or debugs, not a product tour.
    audience_signal: Explain the tradeoff for leads deciding whether to adopt or wait; skip insider-only jokes.
    avoid: Do not write a product review. No 'I tried this tool' war story.
  2:
    focus: Focus on an architecture tradeoff — name the tension in terms a lead can repeat in a meeting.
    audience_signal: Mixed audience should understand the business tension, not just the pattern name.
    avoid: No architecture poetry. One named tension and your side of it.
  3:
    focus: Focus on where C# / .NET sits this year — hiring, adoption, competition, backend choices.
    audience_signal: A take hiring managers and devs can both react to. Plain language first.
    avoid: Do not summarise the piece. Take a side someone can disagree with.
  4:
    focus: Focus on enterprise .NET — cloud, data, security, pipelines; what breaks at scale in plain terms.
    audience_signal: Leads should see delivery or risk implications; avoid tutorial-speak.
    avoid: Do not paste the article. Be specific about failure modes without claiming you shipped this system.
  5:
    focus: Focus on .NET performance — what you'd measure and why it matters to users or cost, not benchmark jargon alone.
    audience_signal: Explain performance impact in business terms; gloss GC, JIT, etc. if you use them.
    avoid: Do not lecture the concept from the article. No invented war stories tied to the article's subject.
  6:
    focus: Focus on what's new in .NET — filter as try, skip, or wait for a team deciding roadmap.
    audience_signal: Useful opinion for leads and seniors, not release-note recitation.
    avoid: Do not write a changelog. Filter it — try, skip, or wait — and why.

audience:
  mode: mixed
  lead_with: impact
  jargon_policy: explain_on_first_use
  closers:
    - "End with a team or hiring tradeoff question a manager could answer — tie it to the article spark."
    - "End asking whether this changes how they'd evaluate seniority or skills on a team."
    - "End with a delivery-risk vs speed question in plain English — no syntax or framework choices."
    - "End with whether they'd bet a production release on this pattern without a specific safeguard — name the safeguard in plain English."

engagement:
  allow_code_snippet: false
  max_sentences_per_paragraph: 2
  closers:
    - "End with a specific A/B choice a C# dev would answer in one line — tie it to the article spark."
    - "End asking what they'd do differently in their codebase — not 'thoughts?'."
    - "End with an 'Anyone else still on X?' style question — X must come from the article topic."
    - "End with a production-readiness question — would you ship this pattern without Y?"

