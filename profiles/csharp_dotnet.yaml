weekday_angles:
  0:
    focus: Focus on a C# language feature or .NET runtime change — syntax, types, performance, or how the language is moving. Talk about what you would actually do differently in code, not a feature recap.
    audience_signal: Write for other C# developers. A hiring manager might lurk, but do not explain the industry to them. If a peer would skip the paragraph, cut it.
    avoid: Do not recap the article. React — what you would try, skip, or argue with.
  1:
    focus: Focus on tooling — IDE, SDK, debugger, NuGet, MSBuild. What changes in the afternoon you already work, not a product tour.
    audience_signal: Sound like you have an opinion on whether you'd try the tool or skip it — speculation is fine, claiming you used this exact tool is not. Peers, not a review site.
    avoid: Do not write a product review or a feature walkthrough. No 'I tried this tool' war story. Decide and move on.
  2:
    focus: Focus on a .NET architecture tradeoff — async, DI, module boundaries, how the system is shaped. Name the tension.
    audience_signal: Another senior should want to agree or argue. Vague 'think about tradeoffs' is a fail.
    avoid: No architecture poetry. No blog rewrite. One named tension and your side of it.
  3:
    focus: Focus on where C# / .NET sits this year — compared to other stacks, hiring, community, or why you still pick it for backend work.
    audience_signal: A take someone can disagree with. Cheerleading 'C# is great' is a fail.
    avoid: Do not summarise the piece. Take a side on adoption, competition, or direction.
  4:
    focus: Focus on enterprise .NET — cloud, data, security, pipelines, what actually breaks when the system is large. Be specific about the failure mode.
    audience_signal: Another senior could nod from their own stack wars, even if they have not touched this exact thing. Tutorial-speak is a fail.
    avoid: Do not paste the article. Keep it any senior .NET backend person could own — without claiming they shipped this specific system.
  5:
    focus: Focus on .NET performance — Span<T>, GC, benchmarks, JIT. What you would measure or change, not a concept name-drop.
    audience_signal: If you have a real allocation/pause war story from your OWN work on a different system, fine. If not, take a view on what to measure or change.
    avoid: Do not lecture the concept from the article. Do not invent a war story tied to the article's exact subject.
  6:
    focus: Focus on what is new or coming in .NET. Filter it — what you would try, skip, or wait on. Not a changelog.
    audience_signal: A useful opinion on the roadmap. Reciting release notes is a fail.
    avoid: Do not write a changelog. Filter it — try, skip, or wait — and why.
