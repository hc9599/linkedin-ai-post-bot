# Daily LinkedIn Post
#
# Secrets (GitHub repo → Settings → Secrets):
#   OPENAI_API_KEY (default provider), GROQ_API_KEY, ANTHROPIC_API_KEY
#   LINKEDIN_TOKEN, LINKEDIN_PERSON_ID

name: Daily LinkedIn Post
on:
  schedule:
    - cron: 30 3 * * 1-5
  workflow_dispatch:
    inputs:
      niche:
        description: Niche profile id (e.g. csharp-dotnet, python)
        required: false
        default: csharp-dotnet
      topic:
        description: Optional manual focus topic (empty = auto trend)
        required: false
        default: ""
      llm_provider:
        description: LLM backend (openai, groq, anthropic)
        required: false
        default: openai

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait a random delay (up to 30 minutes)
        if: github.event_name == 'schedule'
        run: |
            DELAY=$(( RANDOM % 1800 ))
            echo "Sleeping for $DELAY seconds (~$(( DELAY / 60 ))m)"
            sleep $DELAY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install chromium --with-deps

      - name: Run bot
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          PYTHONPATH: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          DRY_RUN: "false"
          NICHE: ${{ github.event.inputs.niche || 'csharp-dotnet' }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'openai' }}
        run: python -u script.py --image
