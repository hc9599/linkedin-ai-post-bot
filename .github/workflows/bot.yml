# Daily LinkedIn Post
#
# This file is the alarm clock. GitHub runs it on weekdays (or when you click
# "Run workflow"). It installs Python, waits a random bit so the post is not
# always at the same minute, then starts script.py.
#
# Secrets live in the GitHub repo settings, not in this file:
#   GROQ_API_KEY, LINKEDIN_TOKEN, LINKEDIN_PERSON_ID
#
# This workflow does not merge anything. It only runs the bot.

name: Daily LinkedIn Post
on:
  # Weekdays around 03:30 UTC, plus a random extra wait in the job below.
  schedule:
    - cron: 30 3 * * 1-5
  # Let you click Run workflow in the Actions tab without waiting for the cron.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait a random delay (up to 30 minutes)
        if: github.event_name == 'schedule'
        run: |
            DELAY=$(( RANDOM % 1800 ))
            echo "Sleeping for $DELAY seconds (~$(( DELAY / 60 ))m)"
            sleep $DELAY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          # Print the post only. Set to "false" when you want LinkedIn to go live.
          DRY_RUN: "true"
          IMAGE: "false"
        run: python -u script.py

      - name: Save post history
        if: success()
        run: |
          git add data/post_history.json
          if git diff --cached --quiet; then
            echo "No history change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record the latest generated LinkedIn draft."
          git push origin "HEAD:${GITHUB_REF_NAME}"
