<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>{{ css|safe }}</style>
</head>
<body class="theme-flow {{ flow_density }}">
<div class="bg bg-dark"></div>

<div class="flow-header">
  <h1 class="flow-title">{{ title }}</h1>
  {% if subtitle %}
  <p class="flow-sub">{{ subtitle }}</p>
  {% endif %}
</div>

<div class="flow-steps">
  {% for step in steps %}
  <div class="flow-step">
    <div class="step-num">{{ step.number }}</div>
    <div class="step-body">
      <div class="step-text">{{ step.text }}</div>
      <div class="step-detail">{{ step.detail }}</div>
    </div>
  </div>
  {% if not loop.last %}
  <div class="flow-connector"></div>
  {% endif %}
  {% endfor %}
</div>

<div class="footer footer-code">
  <div class="footer-row">
    <span class="handle">C# / .NET · developer take</span>
    <span class="badge-csharp">Flow</span>
  </div>
</div>
</body>
</html>
