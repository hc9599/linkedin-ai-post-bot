<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn Infographic — cascade</title>
<style>{{ css|safe }}</style>
</head>
<body>
<div class="bg"></div>

<div class="brand">
  <div class="brand-bar"></div>
  <div class="brand-text">
    C# / .NET
    <span class="sub">ripple effects</span>
  </div>
</div>

<style>
  .hero {
    position: absolute;
    top: 150px;
    left: 60px;
    right: 60px;
    height: 240px;
    z-index: 1;
  }
  .hero .panel {
    height: 100%;
    justify-content: flex-start;
  }
  .hero .panel .body {
    font-size: 44px;
    -webkit-line-clamp: 2;
  }
  .hero .panel .label {
    font-size: 18px;
    letter-spacing: 3px;
  }
  .eyebrow {
    position: absolute;
    top: 460px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #8b949e;
    text-transform: uppercase;
    z-index: 5;
  }
  .satellites {
    position: absolute;
    top: 520px;
    left: 60px;
    right: 60px;
    bottom: 140px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 30px;
    z-index: 1;
  }
  .satellites .panel {
    justify-content: flex-start;
    padding: 24px;
  }
  .satellites .panel .badge {
    position: absolute;
    top: 18px;
    left: 18px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #0d1117;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .satellites .panel .label {
    margin-left: 36px;
    font-size: 14px;
  }
  .satellites .panel .body {
    font-size: 28px;
    margin-top: 8px;
    margin-left: 0;
    -webkit-line-clamp: 4;
  }
  svg.connectors {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
</style>

<div class="hero">
  <div class="panel">
    <div class="accent-bar"></div>
    <div class="label">TRIGGER</div>
    <div class="body">{{ hook }}</div>
  </div>
</div>

<svg class="connectors" width="1080" height="1350" viewBox="0 0 1080 1350">
  <path d="M540 390 C540 430, 220 470, 220 520" stroke="{{ accent }}" stroke-width="2" fill="none" stroke-dasharray="3 5" opacity="0.7"/>
  <path d="M540 390 C540 430, 540 470, 540 520" stroke="{{ accent }}" stroke-width="2" fill="none" stroke-dasharray="3 5" opacity="0.7"/>
  <path d="M540 390 C540 430, 860 470, 860 520" stroke="{{ accent }}" stroke-width="2" fill="none" stroke-dasharray="3 5" opacity="0.7"/>
</svg>

<div class="eyebrow">RIPPLE EFFECTS</div>

<div class="satellites">
  <div class="panel">
    <div class="badge">1</div>
    <div class="label">EFFECT 1</div>
    <div class="body">{{ take }}</div>
  </div>
  <div class="panel">
    <div class="badge">2</div>
    <div class="label">EFFECT 2</div>
    <div class="body">{{ reason }}</div>
  </div>
  <div class="panel">
    <div class="badge">3</div>
    <div class="label">EFFECT 3</div>
    <div class="body">{{ closer }}</div>
  </div>
</div>

<div class="footer">
  {% if source %}
  <div class="source">
    <div class="source-bar"></div>
    <div class="source-text">source: {{ source }}</div>
  </div>
  {% endif %}
  <div class="handle">linkedin post  ·  human take</div>
</div>
</body>
</html>
