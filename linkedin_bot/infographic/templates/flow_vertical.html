<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn Infographic — flow_vertical</title>
<style>{{ css|safe }}</style>
</head>
<body>
<div class="bg"></div>

<div class="brand">
  <div class="brand-bar"></div>
  <div class="brand-text">
    C# / .NET
    <span class="sub">logic flow</span>
  </div>
</div>

<style>
  .stack {
    position: absolute;
    top: 150px;
    left: 60px;
    right: 60px;
    bottom: 130px;
    display: flex;
    flex-direction: column;
    gap: 30px;
    z-index: 1;
  }
  .stack .panel {
    flex: 1 1 0;
    min-height: 0;
  }
  .arrow-down {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
  }
</style>

<div class="stack">
  <div class="panel">
    <div class="accent-bar"></div>
    <div class="label">SPARK</div>
    <div class="body">{{ hook }}</div>
  </div>

  <div class="panel hero">
    <div class="accent-bar"></div>
    <div class="label">TAKE</div>
    <div class="body">{{ take }}</div>
  </div>

  <div class="panel">
    <div class="accent-bar"></div>
    <div class="label">WHY</div>
    <div class="body">{{ reason }}</div>
  </div>

  <div class="panel">
    <div class="accent-bar"></div>
    <div class="label">SO WHAT</div>
    <div class="body">{{ closer }}</div>
  </div>
</div>

{% for y in arrows %}
<svg class="arrow-down" style="top: {{ y }}px;" width="24" height="32" viewBox="0 0 24 32">
  <line x1="12" y1="0" x2="12" y2="22" stroke="{{ accent }}" stroke-width="3" stroke-linecap="round"/>
  <polygon points="3,22 21,22 12,32" fill="{{ accent }}"/>
</svg>
{% endfor %}

<div class="footer">
  {% if source %}
  <div class="source">
    <div class="source-bar"></div>
    <div class="source-text">source: {{ source }}</div>
  </div>
  {% endif %}
  <div class="handle">linkedin post  ·  human take</div>
</div>
</body>
</html>
