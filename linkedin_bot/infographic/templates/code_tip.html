<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>{{ css|safe }}</style>
</head>
<body class="theme-code">
<div class="bg bg-dark"></div>

<h1 class="hero-title">{{ title }}</h1>
<p class="hero-sub">{{ subtitle }}</p>

<div class="tip-stack">
  <div class="code-panel code-panel-highlight tip-panel">
    <pre class="code-block code-block-large"><code>{{ code_html|safe }}</code></pre>
  </div>
  <p class="tip-caption"><span class="detail-label">In plain terms:</span> {{ caption }}</p>
</div>

<div class="footer footer-code">
  <div class="footer-row">
    <span class="handle">C# / .NET · developer take</span>
    <span class="badge-csharp">C# Tip</span>
  </div>
</div>
</body>
</html>
